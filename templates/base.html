<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}SIMTELE-RISK{% endblock %}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1b2430}
 header{background:#12355b;color:#fff;padding:.8rem 1.2rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
 header a{color:#cfe3ff;text-decoration:none} header b{font-size:1.1rem}
 main{max-width:1000px;margin:1.2rem auto;padding:0 1rem}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
 .card{background:#fff;border-radius:10px;padding:1rem;box-shadow:0 1px 3px #0002;text-decoration:none;color:inherit}
 .card h3{margin:.3rem 0}.card .ic{font-size:2rem}
 table{border-collapse:collapse;width:100%;background:#fff;font-size:.88rem;margin:.6rem 0}
 th,td{border:1px solid #d5dbe1;padding:.3rem .5rem;text-align:right} th{background:#e8eef4}
 td:first-child,th:first-child{text-align:left}
 .tabs a{display:inline-block;padding:.35rem .8rem;border-radius:6px;background:#dde6ee;margin-right:.3rem;text-decoration:none;color:#12355b}
 .tabs a.on{background:#12355b;color:#fff}
 label{display:block;margin:.4rem 0 .1rem;font-size:.9rem} input{padding:.35rem;width:11rem}
 button{background:#12355b;color:#fff;border:0;padding:.5rem 1rem;border-radius:6px;cursor:pointer}
 .err{background:#fde8e8;border-left:4px solid #c0392b;padding:.5rem 1rem;margin:.5rem 0}
 .ok{color:#1e7d32;font-weight:600}.mal{color:#b3261e;font-weight:600}
 .box{background:#fff;border-radius:8px;padding:.8rem 1rem;margin:.8rem 0}
 .nota{font-size:.82rem;color:#556}
 img{max-width:100%}
</style></head><body>
<header><b>SIMTELE-RISK</b><a href="{{ url_for('inicio') }}">Panel general</a>
<a href="{{ url_for('historial') }}">Historial de experimentos</a>
<span class="nota" style="color:#9db8d6">Simulador educativo · datos sintéticos · sin conexión a equipos reales</span></header>
<main>{% block cuerpo %}{% endblock %}</main></body></html>
